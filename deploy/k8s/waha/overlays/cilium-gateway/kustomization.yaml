# Exposure after the migration: a TLS passthrough listener on the shared Cilium Gateway
# routes waha.<domain>:9443 to Service mhacs-verify/waha-mtls:9443.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - tlsroute.yaml

