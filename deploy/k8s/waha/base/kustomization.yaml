apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mhacs-verify

labels:
  - pairs:
      app.kubernetes.io/name: waha
      app.kubernetes.io/part-of: mhacs-verification-checker
    includeSelectors: true

resources:
  - namespace.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - vmservicescrape.yaml

configMapGenerator:
  - name: waha-mtls-proxy
    files:
      - default.conf=mtls-proxy.conf
