server {
    listen 9443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate         /etc/mtls/tls.crt;
    ssl_certificate_key     /etc/mtls/tls.key;
    ssl_protocols           TLSv1.3;

    # Mutual TLS: reject the handshake unless the client presents a cert signed by our CA.
    ssl_client_certificate  /etc/mtls/ca.crt;
    ssl_verify_client       on;
    ssl_verify_depth        1;

    client_max_body_size    10m;

    location /api/ {
        proxy_pass          http://127.0.0.1:3000;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Client-Cert-Subject $ssl_client_s_dn;
        proxy_read_timeout  120s;
    }

    location / {
        return 404;
    }
}
