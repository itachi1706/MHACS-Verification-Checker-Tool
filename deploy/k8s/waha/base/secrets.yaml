# Values are filled in from OpenBao by argocd-vault-plugin (AVP) when Argo CD renders the
# manifests. Never commit real values. Paths and keys: deploy/k8s/waha/README.md §2.
apiVersion: v1
kind: Secret
metadata:
  name: waha-env
type: Opaque
stringData:
  WAHA_API_KEY: <path:kv/data/k8s/mhacs-verify/waha#api_key>
  WHATSAPP_HOOK_HMAC_KEY: <path:kv/data/k8s/mhacs-verify/waha#hook_hmac_key>
  WHATSAPP_HOOK_URL: <path:kv/data/k8s/mhacs-verify/waha#hook_url>
  # Shared management Postgres user (same entry as the other apps). WAHA does not
  # percent-decode the URL, so the password must not contain URL-reserved characters.
  WHATSAPP_SESSIONS_POSTGRESQL_URL: postgres://<path:kv/data/k8s/common/postgres#user>:<path:kv/data/k8s/common/postgres#password>@<path:kv/data/k8s/common/postgres#host>:<path:kv/data/k8s/common/postgres#port>/waha_mhacs?sslmode=require
---
apiVersion: v1
kind: Secret
metadata:
  name: waha-mtls
type: Opaque
stringData:
  tls.crt: <path:kv/data/k8s/mhacs-verify/waha-mtls#tls_crt>
  tls.key: <path:kv/data/k8s/mhacs-verify/waha-mtls#tls_key>
  ca.crt: <path:kv/data/k8s/mhacs-verify/waha-mtls#ca_crt>
