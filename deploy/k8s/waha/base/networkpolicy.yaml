# Inbound: the mTLS proxy from anywhere (the edge), metrics from the monitoring namespace
# only. WAHA's port 3000 is unreachable from other pods. Egress stays open: WhatsApp,
# the webhook Lambda and the managed Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waha-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: waha
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9443
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              # Namespace where Prometheus runs; change if yours differs.
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
