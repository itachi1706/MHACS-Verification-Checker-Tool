apiVersion: apps/v1
kind: Deployment
metadata:
  name: waha
spec:
  # Exactly one replica: a WhatsApp session cannot be shared between pods.
  replicas: 1
  # Stop the old pod before starting a new one (single session, ReadWriteOnce volume).
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: waha
  template:
    metadata:
      labels:
        app.kubernetes.io/component: waha
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: waha
          image: devlikeapro/waha:gows-2026.9.2
          envFrom:
            # WAHA_API_KEY, WHATSAPP_HOOK_HMAC_KEY, WHATSAPP_HOOK_URL,
            # WHATSAPP_SESSIONS_POSTGRESQL_URL (omit when using components/local-sessions)
            - secretRef:
                name: waha-env
          env:
            - name: WHATSAPP_DEFAULT_ENGINE
              value: GOWS
            - name: WHATSAPP_START_SESSION
              value: default
            - name: WHATSAPP_HOOK_EVENTS
              value: message,message.revoked,session.status
            - name: WAHA_DASHBOARD_ENABLED
              value: "False"
            - name: WHATSAPP_SWAGGER_ENABLED
              value: "False"
            - name: WAHA_PRINT_QR
              value: "False"
            - name: WAHA_LOG_FORMAT
              value: JSON
            - name: WAHA_LOG_LEVEL
              value: info
            - name: WAHA_CLIENT_DEVICE_NAME
              value: MHACS Verify
            - name: WAHA_EVENTS_DOWNLOAD_MEDIA
              value: "false"
            # Database names: waha_mhacs (main) and waha_mhacs_default (session)
            - name: WAHA_NAMESPACE
              value: mhacs
            - name: WAHA_PROMETHEUS_ENABLED
              value: "True"
            - name: WAHA_LOCAL_STORE_BASE_DIR
              value: /app/.sessions
            - name: WHATSAPP_FILES_FOLDER
              value: /app/.media
            - name: TZ
              value: Asia/Singapore
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sessions
              mountPath: /app/.sessions
            - name: media
              mountPath: /app/.media
            - name: tmp
              mountPath: /tmp
        # Terminates TLS and requires a client certificate signed by our private CA,
        # then forwards /api/* to WAHA on localhost. WAHA's port is never exposed.
        - name: mtls-proxy
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          env:
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          ports:
            - name: mtls
              containerPort: 9443
            - name: metrics
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: mtls
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mtls
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mtls-proxy-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: mtls-certs
              mountPath: /etc/mtls
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
      volumes:
        # Sessions are stored in Postgres; components/local-sessions swaps this for a PVC.
        - name: sessions
          emptyDir:
            sizeLimit: 256Mi
        - name: media
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: proxy-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: mtls-proxy-conf
          configMap:
            name: waha-mtls-proxy
        - name: mtls-certs
          secret:
            # tls.crt / tls.key (server) and ca.crt (CA that signs client certs)
            secretName: waha-mtls
            defaultMode: 0440
