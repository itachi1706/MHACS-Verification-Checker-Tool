# Only the mTLS proxy port is exposed. WAHA's own port (3000) is not part of the Service.
apiVersion: v1
kind: Service
metadata:
  name: waha-mtls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: waha
  ports:
    - name: mtls
      port: 9443
      targetPort: mtls
      protocol: TCP
