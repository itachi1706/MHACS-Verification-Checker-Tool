# Argo CD Application for WAHA. Switch `path` to overlays/cilium-gateway after the migration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mhacs-verify-waha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/itachi1706/MHACS-Verification-Checker-Tool.git
    targetRevision: main
    path: deploy/k8s/waha/overlays/ingress-nginx
    # Render with kustomize, then fill <path:...> placeholders from OpenBao.
    # Use the name of your argocd-vault-plugin CMP for kustomize.
    plugin:
      name: argocd-vault-plugin-kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: mhacs-verify
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
